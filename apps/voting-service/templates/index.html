<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .candidates {
            display: grid;
            gap: 20px;
            margin-bottom: 30px;
        }

        .candidate-card {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .candidate-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
        }

        .candidate-name {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            text-transform: capitalize;
        }

        .candidate-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .vote-count {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .count-label {
            font-size: 0.85em;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        .count-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
        }

        .vote-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-grow: 1;
        }

        .vote-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
        }

        .vote-button:active {
            transform: translateY(0);
        }

        .vote-button.loading {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            margin-top: 10px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            border-radius: 3px;
            transition: width 0.3s ease;
        }

        .footer {
            text-align: center;
            color: #999;
            font-size: 0.85em;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            border: 1px solid #fcc;
        }

        .error.show {
            display: block;
        }

        .success {
            background: #efe;
            color: #3a3;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            display: none;
            border: 1px solid #cfc;
        }

        .success.show {
            display: block;
            animation: fadeOut 3s ease-in-out forwards;
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.5em;
            }

            .candidate-info {
                flex-direction: column;
                align-items: stretch;
            }

            .vote-button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗳️ Voting</h1>
        <p class="subtitle">Cast your vote for your favorite candidate</p>

        <div class="error" id="error"></div>
        <div class="success" id="success">Vote recorded successfully!</div>

        <div class="candidates" id="candidates">
            <p style="text-align: center; color: #999;">Loading candidates...</p>
        </div>

        <div class="footer">
            <p>Total votes: <strong id="totalVotes">0</strong></p>
        </div>
    </div>

    <script>
        const candidatesContainer = document.getElementById('candidates');
        const errorDiv = document.getElementById('error');
        const successDiv = document.getElementById('success');
        const totalVotesSpan = document.getElementById('totalVotes');

        const candidates = ['blue', 'green'];

        async function loadResults() {
            try {
                const results = await Promise.all(
                    candidates.map(async (candidate) => {
                        const response = await fetch(`/result/${candidate}`);
                        if (response.ok) {
                            const votes = await response.text();
                            return { candidate, votes: parseInt(votes) };
                        }
                        return { candidate, votes: 0 };
                    })
                );

                renderCandidates(results);
            } catch (error) {
                console.error('Error loading results:', error);
                showError('Failed to load results');
            }
        }

        function renderCandidates(results) {
            const totalVotes = results.reduce((sum, r) => sum + r.votes, 0);
            totalVotesSpan.textContent = totalVotes;

            candidatesContainer.innerHTML = results
                .map((result) => {
                    const percentage = totalVotes > 0 ? (result.votes / totalVotes * 100) : 0;
                    return `
                        <div class="candidate-card">
                            <div class="candidate-name">${result.candidate}</div>
                            <div class="candidate-info">
                                <div class="vote-count">
                                    <div class="count-label">Votes</div>
                                    <div class="count-value">${result.votes}</div>
                                </div>
                                <button class="vote-button" onclick="vote('${result.candidate}')">
                                    Vote for ${result.candidate}
                                </button>
                            </div>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${percentage}%"></div>
                            </div>
                        </div>
                    `;
                })
                .join('');
        }

        async function vote(candidate) {
            try {
                const button = event.target;
                button.classList.add('loading');
                button.disabled = true;

                const response = await fetch(`/vote/${candidate}`, { method: 'POST' });

                if (response.ok) {
                    showSuccess();
                    await loadResults();
                } else {
                    showError(`Failed to vote for ${candidate}`);
                }
            } catch (error) {
                console.error('Vote error:', error);
                showError('Error submitting vote');
            }
        }

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
            setTimeout(() => errorDiv.classList.remove('show'), 3000);
        }

        function showSuccess() {
            successDiv.classList.add('show');
            setTimeout(() => successDiv.classList.remove('show'), 3000);
        }

        // Load results on page load and refresh every 2 seconds
        loadResults();
        setInterval(loadResults, 2000);
    </script>
</body>
</html>
