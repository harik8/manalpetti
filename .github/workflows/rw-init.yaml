name: INIT

on:
  workflow_call:
    inputs:
      apps_path:
        type: string
        description: Path to the application source code build context
        default: '["${{ github.event.repository.name }}"]'
        required: false
      apps_path_depth:
        type: string
        description: Apps path's depth from root directory
        default: 1-2
        required: false
    outputs:
      apps_modified:
        description:  List of applications modified in the last commit
        value: ${{ jobs.INIT.outputs.apps_modified }}

jobs:
  INIT:
    runs-on: ubuntu-slim
    outputs:
      apps_modified:  ${{ steps.get_apps_modified.outputs.apps_modified }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 2

    - name: Get Apps Modified
      id: get_apps_modified
      run: |
        apps_modified=$(git diff HEAD HEAD~ --name-only \
          | grep '/' \
          | cut -d'/' -f${{ inputs.apps_path_depth }} \
          | grep -E "${{ inputs.apps_path }}" \
          | sort -u \
          | jq -R . | jq -s .)
        echo $apps_modified

        echo "apps_modified<<EOF" >> $GITHUB_OUTPUT
        echo "$apps_modified" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
