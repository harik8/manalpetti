name: INIT

on:
  workflow_call:
    inputs:
      apps_path:
        type: string
        description: Path to the application source code build context
        default: '["${{ github.event.repository.name }}"]'
        required: false
      apps_path_depth:
        type: string
        description:  Depth level of apps within apps_path (e.g., 2 for apps/*, 3 for apps/*/*)
        default: 2
        required: false
    outputs:
      apps_modified:
        description: List of applications modified in the last commit
        value: ${{ jobs.INIT.outputs.apps_modified }}
      clusters:
        description: Flat list of {app, cluster} pairs for the CD matrix
        value: ${{ jobs.INIT.outputs.clusters }}

jobs:
  INIT:
    runs-on: ubuntu-slim
    outputs:
      apps_modified: ${{ steps.get_apps_modified.outputs.apps_modified }}
      clusters: ${{ steps.get_clusters.outputs.clusters }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 2

    - name: Get Apps Modified
      id: get_apps_modified
      run: |
        apps_modified=$(git diff HEAD HEAD~ --name-only \
          | grep '/' \
          | cut -d'/' -f1-${{ inputs.apps_path_depth }} \
          | grep -E "${{ inputs.apps_path }}" \
          | sort -u \
          | jq -R . | jq -s -c .)
        echo "$apps_modified"
        echo "apps_modified=$apps_modified" >> $GITHUB_OUTPUT
    
    - name: Get Clusters
      id: get_clusters
      shell: python
      env:
        PR_LABELS: ${{ join(github.event.pull_request.labels.cd-skip:*.name, ',') }}
      run: |
        import os, json

        print(os.environ.get('PR_LABELS'))

        labels = os.environ.get('PR_LABELS', '').split(',')
        skip_clusters = [l.replace('cd-skipcluster:', '').strip() for l in labels if l.startswith('cd-skipcluster:')]
        print(f'Skipping clusters: {skip_clusters}')

        clusters_map = {}
        for app in ${{ steps.get_apps_modified.outputs.apps_modified }}:
            dirs = [file for file in os.listdir(app + "/.helm") if os.path.isdir(app + "/.helm/" + file)]
            clusters_map[app] = dirs

        print(clusters_map)

        clusters = []
        for app, cluster_list in clusters_map.items():
            for cluster in cluster_list:
                if cluster in skip_clusters:
                    print(f'Skipping cluster {cluster} for {app}')
                    continue
                clusters.append({"app": app, "cluster": cluster})

        print(json.dumps(clusters, indent=2))

        with open(os.environ['GITHUB_OUTPUT'], 'a') as fd:
            fd.write(f'clusters={json.dumps(clusters)}\n')
