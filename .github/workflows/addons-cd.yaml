---
name: Addons CD

on:
  push:
    branches:
      - main
      - dev
    paths:
      - addons/charts/**
      - addons/custom/*/.helm/**
  pull_request:
    branches:
      - main
      - dev
    paths:
      - addons/charts/**
      - addons/custom/*/.helm/**
        
jobs:
  CD:
    runs-on: self-hosted
    timeout-minutes: 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Addons Upgrade Install
      id: install_addons
      run: |
        cd addons/charts

        # echo "Installing argo-rollouts..."
        # version=$(yq e '.dependencies[].version' argo-rollouts/Chart.yaml)
        # helm upgrade --install --rollback-on-failure --force-conflicts --create-namespace --namespace argo-rollouts --version $version --values argo-rollouts/values.yaml  argo-rollouts argo/argo-rollouts

        echo "Installing alloy..."
        version=$(yq e '.dependencies[].version' alloy/Chart.yaml)
        helm upgrade --install --rollback-on-failure --force-conflicts --create-namespace --namespace alloy --version $version --values alloy/values.yaml alloy alloy/alloy

        echo "Installing grafana..."
        version=$(yq e '.dependencies[].version' grafana/Chart.yaml)
        helm upgrade --install --rollback-on-failure --force-conflicts --create-namespace --namespace grafana --version $version --values grafana/values.yaml grafana alloy/grafana

