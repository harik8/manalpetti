        # version=$(yq e '.dependencies[].version' cnpg/Chart.yaml)
        # helm upgrade --install --rollback-on-failure --force-conflicts --create-namespace --namespace cnpg --force-conflicts --version $version --values cnpg/values.yaml cnpg cnpg/cloudnative-pg

        # echo "Installing ingress-haproxy..."
        # version=$(yq e '.dependencies[].version' ingress-haproxy/Chart.yaml)
