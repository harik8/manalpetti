---
traces:
  otlp:
    grpc:
      enabled: true
      receiverConfig: {}
      port: 4317
    http:
      enabled: false
      receiverConfig: {}

tempo:
  overrides:
    defaults:
      metrics_generator:
        processors:
          - service-graphs
          - span-metrics
          - local-blocks

persistence:
  enabled: true

ingester:
  replicas: 1
  persistence:
    enabled: true
    size: 5Gi

minio:
  enabled: true

storage:
  trace:
    backend: s3
    s3:
      bucket: tempo-traces
      endpoint: tempo-minio:9000
      access_key: grafana-tempo
      secret_key: supersecret
      insecure: true

metrics_generator:
  processor:
    local_blocks:
      flush_to_storage: true
