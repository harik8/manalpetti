tempo:
  ingester:
    max_block_duration: 10080m
  storage:
    trace:
      backend: local

  metrics_generator:
    processor:
      local_blocks:
        flush_to_storage: true
    overrides:
      defaults:
        metrics_generator:
          processors:
            - service-graphs
            - span-metrics
            - local-blocks

persistence:
  enabled: true
  size: 10Gi
